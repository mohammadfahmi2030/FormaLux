<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Speaker Gradients -->
    <radialGradient id="spkBody" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="50%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </radialGradient>
    <radialGradient id="spkRim" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#9ca3af"/>
      <stop offset="90%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </radialGradient>
    <radialGradient id="spkCone" cx="40%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="40%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <radialGradient id="spkCap" cx="35%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="30%" stop-color="#9ca3af"/>
      <stop offset="70%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </radialGradient>
    <!-- Note Gradients -->
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="noteGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.2"/>
    </linearGradient>
    <!-- Drop Shadows -->
    <filter id="spkShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="noteShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-2" dy="4" stdDeviation="3" flood-color="#1e3a8a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Shadow Base -->
  <ellipse cx="64" cy="116" rx="46" ry="7" fill="#000000" opacity="0.18"/>

  <!-- Speaker Assembly -->
  <g filter="url(#spkShadow)">
    <!-- Back Magnet/Housing -->
    <ellipse cx="78" cy="62" rx="36" ry="46" fill="url(#spkBody)" stroke="#111827" stroke-width="2"/>
    
    <!-- Outer Metallic Rim -->
    <ellipse cx="74" cy="62" rx="34" ry="44" fill="url(#spkRim)"/>
    
    <!-- Inner Cone Surround (Rubber/Foam) -->
    <ellipse cx="74" cy="62" rx="30" ry="39" fill="#18181b"/>
    <ellipse cx="73" cy="62" rx="27" ry="36" fill="url(#spkCone)"/>
    
    <!-- Cone Ribs / Acoustic Ring -->
    <ellipse cx="72" cy="62" rx="20" ry="26" fill="none" stroke="#374151" stroke-width="1.5" opacity="0.6"/>
    <ellipse cx="71" cy="62" rx="14" ry="18" fill="none" stroke="#4b5563" stroke-width="1.2" opacity="0.5"/>

    <!-- Dust Cap (Dome) -->
    <ellipse cx="70" cy="62" rx="10" ry="13" fill="url(#spkCap)"/>
    <!-- Specular Highlight on Dome -->
    <ellipse cx="67" cy="58" rx="4" ry="5" fill="#ffffff" opacity="0.65"/>
  </g>

  <!-- Musical Note (Treble / Eighth Note) on the Left -->
  <g filter="url(#noteShadow)">
    <!-- Note Stem 1 -->
    <path d="M22 66 C22 50, 36 24, 38 18 C39 15, 42 16, 42 19 L42 68 C39 64, 34 62, 28 64 C20 67, 16 75, 18 82 C21 89, 29 92, 36 89 C43 85, 45 77, 44 70 L44 26 C44 22, 47 22, 50 25 C54 28, 56 36, 52 46 C48 54, 45 56, 45 58" fill="url(#noteGrad)"/>
    <!-- Highlight Reflection on Note Stem -->
    <path d="M23 68 C23 54, 36 28, 38 21 L40 22 C38 30, 26 56, 26 69 Z" fill="#ffffff" opacity="0.45"/>
    <!-- Note Head 3D Specular -->
    <ellipse cx="27" cy="76" rx="6" ry="4" fill="#60a5fa" opacity="0.75" transform="rotate(-25 27 76)"/>
  </g>
</svg>
