<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <filter id="regGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#b45309" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#regGlow)">
    <!-- 4 Solid Orange Corner Handles -->
    <!-- Top-Left -->
    <rect x="7" y="7" width="5" height="5" fill="#d97706" rx="0.5"/>
    <!-- Top-Right -->
    <rect x="26" y="7" width="5" height="5" fill="#d97706" rx="0.5"/>
    <!-- Bottom-Left -->
    <rect x="7" y="26" width="5" height="5" fill="#d97706" rx="0.5"/>
    <!-- Bottom-Right -->
    <rect x="26" y="26" width="5" height="5" fill="#d97706" rx="0.5"/>

    <!-- Dashed Orange Lines Connecting Corners -->
    <!-- Top Horizontal -->
    <line x1="12" y1="9.5" x2="26" y2="9.5" stroke="#d97706" stroke-width="2.5" stroke-dasharray="3,2.5"/>
    <!-- Bottom Horizontal -->
    <line x1="12" y1="28.5" x2="26" y2="28.5" stroke="#d97706" stroke-width="2.5" stroke-dasharray="3,2.5"/>
    <!-- Left Vertical -->
    <line x1="9.5" y1="12" x2="9.5" y2="26" stroke="#d97706" stroke-width="2.5" stroke-dasharray="3,2.5"/>
    <!-- Right Vertical -->
    <line x1="28.5" y1="12" x2="28.5" y2="26" stroke="#d97706" stroke-width="2.5" stroke-dasharray="3,2.5"/>
  </g>
  <!-- Downward Arrow on the Right -->
  <polygon points="36,19 43,19 39.5,24" fill="#475569"/>
</svg>
