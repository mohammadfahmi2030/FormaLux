<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <!-- Lens Barrel on Left -->
  <rect x="2" y="10" width="7" height="12" rx="2" fill="#475569" stroke="#1e293b" stroke-width="1"/>
  <ellipse cx="2" cy="16" rx="2" ry="5" fill="url(#lensGrad)"/>
  <!-- Main Camera Body -->
  <rect x="8" y="7" width="18" height="18" rx="3" fill="url(#bodyGrad)" stroke="#475569" stroke-width="1"/>
  <!-- Top Handle / Mic -->
  <path d="M12 7 L12 4 L22 4 L22 7" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <!-- Red REC screen / badge on side -->
  <rect x="11" y="11" width="12" height="10" rx="1.5" fill="#0f172a"/>
  <circle cx="14" cy="16" r="2.2" fill="#ef4444"/>
  <text x="17" y="17.5" font-family="Arial, sans-serif" font-weight="900" font-size="5" fill="#ef4444">REC</text>
  <!-- Highlight reflection -->
  <line x1="9" y1="9" x2="25" y2="9" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
</svg>
